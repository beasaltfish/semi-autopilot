packages:
  - shared
  - discord-monitor
  - ai-assistant
  - x-poster
  - tweet-generator
  - wechat-collector
  - wechat-responder
  - db

# Native addons whose install scripts must run. pnpm 10 skips build steps by
# default; the SQLCipher driver needs its prebuilt binary linked.
onlyBuiltDependencies:
  - better-sqlite3-multiple-ciphers

# Shared across the packages — bump here, not in each package.json.
catalog:
  pg: ^8.22.0
  winston: ^3.19.0
  '@types/pg': ^8.20.0
  vitest: ^3.2.4
  playwright: ^1.62.1
  dotenv: ^17.4.2
  drizzle-orm: ^0.45.2
  drizzle-kit: ^0.31.10
