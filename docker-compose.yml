# Pinned, because Compose otherwise names the project — and so the volume —
# after the directory. Renaming the checkout would then silently start a new,
# empty database next to the old one.
name: semi-autopilot

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: semi-autopilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: semi_autopilot
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-defaultpassword123}  # local dev default — set DB_PASSWORD env var in production
    ports:
      # Loopback only. Docker's default "5432:5432" binds 0.0.0.0, which put
      # this database — with a password committed to a public repo — on the
      # local network for anyone on the same WiFi.
      - "127.0.0.1:5432:5432"
    # `docker compose up --wait` blocks on this, so `pnpm db:up` can run
    # migrations immediately after instead of guessing with sleep.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d semi_autopilot"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local